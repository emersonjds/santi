name: ci

on:
  push:
    branches: [main, developer, "chore/**", "ci/**", "feat/**", "fix/**", "docs/**", "refactor/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  COVERAGE_IGNORE: '/main\.rs$'

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: santi
          POSTGRES_PASSWORD: santi
          POSTGRES_DB: santi
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U santi -d santi"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgres://santi:santi@localhost:5440/santi
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features postgres,rustls
      - run: sqlx migrate run --source crates/santi-server/migrations
      - run: cargo sqlx prepare --workspace --check
      - run: >
          cargo llvm-cov --workspace --ignore-filename-regex "$COVERAGE_IGNORE"
          --fail-under-lines 90 --fail-under-functions 90 --fail-under-regions 90

  branch-coverage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: santi
          POSTGRES_PASSWORD: santi
          POSTGRES_DB: santi
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U santi -d santi"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgres://santi:santi@localhost:5440/santi
      SQLX_OFFLINE: "true"
      # rust-toolchain.toml pins stable; branch coverage needs nightly.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: >
          cargo llvm-cov --workspace --branch --ignore-filename-regex "$COVERAGE_IGNORE"
          --json --summary-only --output-path coverage.json
      - name: Enforce 90% branch coverage
        run: |
          jq -r '.data[0].files[] | select(.summary.branches.count > .summary.branches.covered)
            | "\(.filename): \(.summary.branches.covered)/\(.summary.branches.count) branches"' coverage.json
          jq -e '.data[0].totals.branches | .count == 0 or .percent >= 90' coverage.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm size
      - run: pnpm audit --prod
      - name: Generated API types match the committed openapi.json
        run: pnpm gen:api && git diff --exit-code src/shared/api/schema.d.ts

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: santi
          POSTGRES_PASSWORD: santi
          POSTGRES_DB: santi
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U santi -d santi"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgres://santi:santi@localhost:5440/santi
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm build
        working-directory: web
      - run: cargo build -p santi-server
      - name: Start the server with the SPA build
        run: |
          SANTI_ADDR=127.0.0.1:8089 SANTI_WEB_DIR=web/dist SANTI_IP_LIMITS=off target/debug/santi-server > server.log 2>&1 &
          for attempt in $(seq 60); do curl -sf http://127.0.0.1:8089/health && exit 0; sleep 1; done
          cat server.log
          exit 1
      - run: pnpm e2e
        working-directory: web

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t santi:ci .
      - run: docker image ls santi:ci
