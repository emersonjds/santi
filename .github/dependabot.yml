version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: developer
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    target-branch: developer
    schedule:
      interval: weekly
    groups:
      docker:
        update-types: [minor, patch]
    # Node moves between LTS releases by hand: odd majors are not LTS and newer majors drop corepack.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: cargo
    directory: /
    target-branch: developer
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    target-branch: developer
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
    # The Node type definitions follow the Node major the image runs.
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
