# `docker compose up -d`: the published santi image on http://localhost:8080 with its PostgreSQL.
# `docker compose up -d postgres`: PostgreSQL only, on localhost:5440, for development.
# Build from this checkout instead: `docker compose -f compose.yaml -f compose.build.yaml up -d --build`.
services:
  santi:
    image: ghcr.io/emersonjds/santi:${SANTI_VERSION:-latest}
    environment:
      DATABASE_URL: postgres://santi:santi@postgres:5432/santi
    ports:
      - "127.0.0.1:${SANTI_PORT:-8080}:8080"
    volumes:
      - santi-attachments:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: santi
      POSTGRES_PASSWORD: santi
      POSTGRES_DB: santi
    ports:
      - "127.0.0.1:${SANTI_DB_PORT:-5440}:5432"
    volumes:
      - santi-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U santi -d santi"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  santi-postgres:
  santi-attachments:
