{% macro brand(href) %}
<a class="brand" href="{{ href }}">
  <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="7"/><path d="M7 8h10M7 12h6M7 16h8"/></svg>
  <span>santi</span>
</a>
{% endmacro %}

{% macro field(name, label, kind, value, autocomplete, error) %}
<div class="field">
  <label for="{{ name }}">{{ label }}</label>
  <input id="{{ name }}" name="{{ name }}" type="{{ kind }}" value="{{ value }}" autocomplete="{{ autocomplete }}" required
    {%- if !error.is_empty() %} aria-invalid="true" aria-describedby="{{ name }}-error"{% endif %}>
  {%- if !error.is_empty() %}
  <p class="field-error" id="{{ name }}-error">{{ label }} {{ error }}.</p>
  {%- endif %}
</div>
{% endmacro %}
