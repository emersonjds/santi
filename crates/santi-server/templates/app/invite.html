{% extends "app/shell.html" %}
{% import "shared/ui.html" as ui %}
{% block title %}Join a project{% endblock %}
{% block main %}
<div class="max-w-xl">
  <h1 class="text-2xl font-semibold tracking-tight">Join a project</h1>
  <p class="mt-1.5 text-text-muted">You were invited to a project. Joining adds it to your sidebar.</p>
  <form class="mt-6" method="post" action="/invites/{{ token }}">
    {{ ui::submit("Join project") }}
  </form>
</div>
{% endblock %}
