[package]
name = "santi-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "santi"
path = "src/main.rs"

[dependencies]
santi-types = { workspace = true, features = ["schemars"] }
axum.workspace = true
chrono.workspace = true
clap.workspace = true
reqwest.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-std", "signal", "sync"] }
toml.workspace = true

[dev-dependencies]
santi-server.workspace = true
sqlx.workspace = true
assert_cmd = "2"
predicates = "3"
rmcp = { workspace = true, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
tempfile = "3"

[lints]
workspace = true
